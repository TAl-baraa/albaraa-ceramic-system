name: albaraa-ceramic

services:
  db:
    image: postgres:17-alpine
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ceramic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - ceramic_internal

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ceramic_internal

volumes:
  ceramic_postgres_data:

networks:
  ceramic_internal:
    driver: bridge
